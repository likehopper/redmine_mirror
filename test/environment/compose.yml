# Configure or run the isolated local Redmine integration-test environment.

name: redmine-mirror-test
x-redmine: &redmine
  image: redmine-mirror-test:6.1.4
  build: .
  entrypoint: ["bash", "/mirror-environment/boot.sh"]
  environment: &environment
    RAILS_ENV: production
    SECRET_KEY_BASE: mirror-disposable-test-only-secret-abcdefghijklmnopqrstuvwxyz0123456789
    MIRROR_TEST_ENVIRONMENT: disposable
    GOOGLE_CHROME_OPTS_ARGS: headless,disable-gpu,no-sandbox,disable-dev-shm-usage
  networks: [mirror]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
    interval: 5s
    timeout: 5s
    start_period: 60s
    retries: 24
services:
  source:
    <<: *redmine
    environment:
      <<: *environment
      MIRROR_ROLE: source
      MIRROR_SOURCE_PLUGIN: "1"
    volumes:
      - .:/mirror-environment:ro
      - ../..:/mirror-plugin:ro
      - source-data:/mirror-data
  destination:
    <<: *redmine
    environment:
      <<: *environment
      MIRROR_ROLE: destination
      MIRROR_SOURCE_API_KEY: "1111111111111111111111111111111111111111"
      MIRROR_DESTINATION_API_KEY: "2222222222222222222222222222222222222222"
      MIRROR_CONFIG: /mirror-data/mirror.json
      MIRROR_DESTINATION_URL: http://destination:3000
    volumes:
      - .:/mirror-environment:ro
      - ../..:/mirror-plugin:ro
      - destination-data:/mirror-data
  worker:
    <<: *redmine
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      <<: *environment
      MIRROR_ROLE: destination
      MIRROR_WORKER: "1"
      MIRROR_DESTINATION_URL: http://destination:3000
      MIRROR_DESTINATION_API_KEY: "2222222222222222222222222222222222222222"
    volumes:
      - .:/mirror-environment:ro
      - ../..:/mirror-plugin:ro
      - destination-data:/mirror-data
    depends_on:
      destination:
        condition: service_healthy
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:3101:3101", "127.0.0.1:3102:3102"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [mirror, frontend]
    depends_on:
      source:
        condition: service_healthy
      destination:
        condition: service_healthy
networks:
  frontend:
  mirror:
    internal: true
volumes:
  source-data:
  destination-data:
