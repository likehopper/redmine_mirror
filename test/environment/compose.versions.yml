# Cross-version stack for versions.sh: the source runs the official image of an older
# Redmine (it only serves its REST API), the destination a selected Mirror-capable one.

x-health: &health
  # Official images do not all ship curl.
  test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://127.0.0.1:3000/login')).code == '200'"]
services:
  source:
    image: ${MIRROR_SOURCE_IMAGE:?Set MIRROR_SOURCE_IMAGE, for example redmine:4.2}
    build: !reset null
    healthcheck: *health
  destination:
    image: redmine-mirror-test:${MIRROR_DESTINATION_VERSION:?Set MIRROR_DESTINATION_VERSION, for example 6.1.4}
    build:
      args:
        BASE_IMAGE: reporting-compat-ready:${MIRROR_DESTINATION_VERSION}
    healthcheck: *health
  worker:
    image: redmine-mirror-test:${MIRROR_DESTINATION_VERSION}
    build:
      args:
        BASE_IMAGE: reporting-compat-ready:${MIRROR_DESTINATION_VERSION}
