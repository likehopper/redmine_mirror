#
# Text format conversion stack for formats.sh: a Redmine 4.2 source with CKEditor and
# per-project formatting, and a destination with the CKEditor plugin found at
# MIRROR_CKEDITOR_PATH (not part of this repository) on redmine-mirror-test:<version>.

x-health: &health
  test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://127.0.0.1:3000/login')).code == '200'"]
  interval: 5s
  timeout: 5s
  start_period: 300s
  retries: 60
x-destination-build: &destination-build
  context: ./formats
  dockerfile: destination.Dockerfile
  additional_contexts:
    ckeditor: ${MIRROR_CKEDITOR_PATH:?Set MIRROR_CKEDITOR_PATH to a redmine_ckeditor plugin directory}
  args:
    BASE_IMAGE: redmine-mirror-test:${MIRROR_DESTINATION_VERSION:-5.1.13}
services:
  source:
    image: redmine-mirror-formats-source:4.2
    build: !override
      context: ./formats
      dockerfile: Dockerfile
    healthcheck: *health
    environment:
      MIRROR_SOURCE_PLUGIN: "0"
  destination:
    image: redmine-mirror-formats-destination:${MIRROR_DESTINATION_VERSION:-5.1.13}
    build: !override
      <<: *destination-build
    healthcheck: *health
  worker:
    image: redmine-mirror-formats-destination:${MIRROR_DESTINATION_VERSION:-5.1.13}
    build: !override
      <<: *destination-build
