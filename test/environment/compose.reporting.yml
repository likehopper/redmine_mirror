# Add redmine_reporting to both instances, for the Reporting adapter checks.
# MIRROR_REPORTING_PATH points to a redmine_reporting checkout.

x-reporting: &reporting
  - ${MIRROR_REPORTING_PATH:?Set MIRROR_REPORTING_PATH to a redmine_reporting checkout}:/reporting-plugin:ro
services:
  source:
    volumes: *reporting
  destination:
    volumes: *reporting
  worker:
    volumes: *reporting
