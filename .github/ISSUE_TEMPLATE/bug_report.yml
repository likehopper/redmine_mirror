name: Bug report
description: Report a reproducible Mirror problem using sanitized data.
body:
  - type: markdown
    attributes:
      value: Do not include API keys or private issue contents. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Plugin version/commit, source and destination Redmine versions, Ruby, Rails, database, deployment and worker setup.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Adapters and mappings
      description: Enabled adapters, relevant mapping rules and preview/apply mode. Remove credentials and private identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps with fictitious data, including whether a second run reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs or screenshots
      description: Remove API keys, private notes, attachments and personal/customer data.
