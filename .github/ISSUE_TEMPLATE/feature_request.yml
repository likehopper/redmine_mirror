name: Feature or adapter request
description: Describe a synchronization need or a new adapter.
body:
  - type: textarea
    id: need
    attributes:
      label: Use case and intended behavior
      description: What data should be imported and why? Include the source and destination modules.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API contract and permissions
      description: Available endpoints, project ownership, identity, dependencies and authorization. Link to documentation when available.
  - type: textarea
    id: behavior
    attributes:
      label: Mappings, conflicts and repeat imports
      description: Explain desired handling of missing references, local edits, historical data and cross-project links.
