name: Mirror validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  redmine:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Redmine 6.1.4 / SQLite / Chromium
        run: bash test/compatibility/run.sh
      - name: Package committed candidate
        run: bash scripts/package.sh HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mirror-validation
          path: |
            /tmp/redmine-mirror-compat.*/build.log
            /tmp/redmine-mirror-compat.*/test.log
            /tmp/redmine-mirror-compat.*/screenshots/
            dist/*.tar.gz
            dist/*.sha256
