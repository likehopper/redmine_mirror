  text_mirror_issue_hierarchy: "Parents are linked after issues are imported. An unsynchronized parent is reported with its link in the log. Synchronize its project and rerun the child project. Native Redmine cross-project subtask rules apply."
  text_mirror_issue_watchers: "Refresh connection references to discover watchers, including source non-members, then configure their mappings in Users. Anonymized users are not subscribed. Mapped users must be able to view the issue. Local subscriptions are preserved; remote removals are not propagated."
  label_mirror_module_issue_custom_fields: "Issue custom fields"
  label_mirror_module_wiki: "Wiki"
  label_mirror_module_wiki_attachments: "Wiki attachments"
  text_mirror_wiki: "Pages are imported with their versions, authors, dates, parents and attachments, without notifications. Authors of every version appear in Users. A page renamed on the source is imported as a new page; deletions are propagated in mirror mode only."
  label_mirror_mapping_custom_field: "Custom field"
  text_mirror_custom_fields: "Map each source field to a local field, or ignore it, then save to configure list values. Create local fields in Redmine administration and enable them for the project and its trackers. A value that cannot be written (field not enabled for a tracker, missing value mapping, invalid value) is skipped with a warning; the issue is still synchronized."
