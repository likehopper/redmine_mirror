  label_mirror_source_wins: "The source wins (mirror mode)"
  text_mirror_source_wins: "Local changes are overwritten, objects deleted locally are created again, and objects deleted on the source are deleted here once the source confirms each of them. Beyond 10% of a module's objects, deletions wait for a confirmation. Unchecked, Mirror adds and updates only, and reports local changes as conflicts."
  label_mirror_flag_local_overwritten: "Local changes overwritten"
  label_mirror_flag_recreated: "Created again"
  text_mirror_deletions_await: "%{count} deletions exceed the safety limit and were not applied."
  button_mirror_confirm_deletions: "Synchronize and confirm the %{count} deletions"
  text_mirror_confirm_deletions: "Delete the %{count} local objects deleted on the source? This cannot be undone."
  label_mirror_ignore_group: "Do not add this group"
  label_mirror_mapping_role: "Roles"
  label_mirror_mapping_group: "Groups"
  label_mirror_module_project_members: "Members"
  text_mirror_project_members: "Optional: unselect Members in Connection to add members by hand. Source members are added to existing local users (mapped in Users) with the local roles mapped below; Mirror creates no account, group or role, and removes nothing outside mirror mode. Locked accounts can be added. Roles inherited from a group or a parent project are not copied. With Manage members, the Users tab offers every account of this Redmine."
  label_mirror_module_documents: "Documents"
  label_mirror_module_document_attachments: "Document files"
  label_mirror_mapping_document_category: "Document categories"
  text_mirror_documents: "Documents are imported with their category, date and files, without notifications. Redmine has no documents API: the source Redmine must run Redmine Mirror 1.0.0-beta.19 or later, its administrator must allow Mirror source, and the source project must enable the Mirror source module and share Documents. The source API key needs View documents. File authors appear in Users; deletions are propagated in mirror mode only."
  text_mirror_documents_source_hint: "(the source must run Redmine Mirror and share Documents through its Mirror source module)"
  label_mirror_module_project_files: "Files"
  label_mirror_module_news: "News"
  label_mirror_module_news_comments: "News comments"
  label_mirror_module_news_attachments: "News files"
  text_mirror_news: "News are imported with their summary, author, date, comments and files, without notifications. Redmine's API does not provide news comments nor files: the source Redmine must run Redmine Mirror 1.0.0-beta.26 or later, its administrator must allow Mirror source, and the source project must enable the Mirror source module and share News. The source API key needs View news. Authors appear in Users; deletions are propagated in mirror mode only."
  label_mirror_module_issue_tags: "Tags"
  label_mirror_module_scrum: "Scrum sprints"
  label_mirror_module_queries: "Saved queries"
  label_mirror_module_project_queries: "Saved queries"
  text_mirror_project_queries: "The project's saved queries of issues, time entries and agile boards are recreated with their filters, columns, sorts, grouping and board options, translated through the mappings of the other tabs (statuses, trackers, priorities, activities, users, roles, custom fields) and the imported versions, categories, issues and sprints. A query with a filter that cannot be translated is not created and is logged as ignored; columns, sorts and groups that do not exist here are left out. A private query goes to its mapped owner, locked or not, and is ignored when the owner is anonymized. A query shown to roles goes to the roles mapped in Members, or else to the roles that can edit the project. The API does not provide query definitions: the source Redmine must run Redmine Mirror 1.0.0-beta.31 or later and share Saved queries through its Mirror source module; the source API key needs View issues."
  text_mirror_project_queries_source_hint: "(the source must run Redmine Mirror and share Saved queries through its Mirror source module)"
  label_mirror_module_agile_sprints: "Agile sprints"
  label_mirror_module_agile_issues: "Agile issue data"
  text_mirror_agile_sprints: "Scrum sprints of the source become agile sprints (redmine_agile PRO on this Redmine): name, description, dates, status and sharing. Product backlogs become sprints under their name; a locked sprint is open; a closed sprint stays closed even if it holds open issues. A second sprint of the same name gets its source number. The Scrum plugin has no API: the source Redmine must run Redmine Mirror 1.0.0-beta.30 or later, its administrator must allow Mirror source, and the source project must enable the Mirror source module and share Scrum sprints. The source API key needs View sprint board. Enable the Agile module on this project."
  text_mirror_agile_issues: "Each imported issue gets its sprint, its backlog position and its story points as agile data, without journals nor notifications. Story points come from the Scrum story points field; a fraction is rounded up (0.5 becomes 1), the field itself is copied by the custom fields module. A sprint of another project (shared with subprojects) waits until that project is synchronized. The remaining effort history has no agile equivalent and is not copied. A local change is a conflict, except in mirror mode."
  text_mirror_agile_source_hint: "(the source must run Redmine Mirror and share Scrum sprints through its Mirror source module)"
  text_mirror_issue_tags: "The current tags of imported issues are copied, without journals nor notifications; tag changes already come with the issue history. Both Redmines need the Redmine Tags plugin (RedmineUP). Redmine's API does not provide tags: the source Redmine must run Redmine Mirror 1.0.0-beta.28 or later, its administrator must allow Mirror source, and the source project must enable the Mirror source module and share Tags. The source API key needs View issues. Local tags are kept, and a tag from the source removed locally is a conflict; mirror mode sets exactly the source tags."
  text_mirror_issue_tags_source_hint: "(the source must run Redmine Mirror and share Tags through its Mirror source module)"
  text_mirror_news_source_hint: "(the source must run Redmine Mirror and share News through its Mirror source module)"
  text_mirror_project_files: "Files of the Files module are imported with their version, description, author, date and download count, without notifications. Enable the Files module on both projects; the source API key needs View files. A file waits for the next run while its version is not imported. File authors appear in Users; deletions are propagated in mirror mode only."
